name: Automated Tests CI

# Триггер: запуск при любом push в ветки main или master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    # 1. Выбор операционной системы для виртуальной машины
    runs-on: ubuntu-latest

    steps:
    # 2. Клонирование (скачивание) кода из твоего репозитория на виртуальную машину
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 3. Установка Python нужной версии
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 4. Установка зависимостей (pip и pytest)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Запуск тестов
    - name: Run tests with pytest
      run: |
        pytest -v